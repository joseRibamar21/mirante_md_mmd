name: CI

# A cada push na main e em pull requests: compila no Linux e no Windows, roda os testes do Rust,
# instala os pacotes em sistemas limpos, abre o app e guarda capturas de tela (aba Actions →
# execução → Artifacts: instaladores e capturas).
on:
  push:
    branches: [main, tauri]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilar (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
          # Mac: um .dmg universal (Apple Silicon e Intel)
          - name: macOS
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev

      - run: npm ci

      - name: Prompts de IA em dia com docs/ia/
        if: runner.os == 'Linux'
        run: python3 scripts/gerar-ia.py --check

      # prévia no Explorer: a DLL vai dentro do instalador (tauri.windows.conf.json) e o teste-explorer.exe,
      # para o job de instalação. Vem antes dos testes: o tauri-build recusa compilar se a DLL listada
      # nos recursos ainda não existe
      - name: Prévia do Explorer (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: bash
        run: |
          cargo build --release -p mirante-preview --lib --example teste-explorer
          ls -l target/release/mirante_preview.dll target/release/examples/teste-explorer.exe

      - name: Testes do Rust
        working-directory: src-tauri
        run: cargo test --workspace

      # Quick Look: as extensões vão para Mirante.app/Contents/PlugIns (tauri.macos.conf.json)
      - name: Extensões do Quick Look (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/macos/quicklook/build.sh

      - name: Gerar instaladores
        run: npx tauri build ${{ matrix.args }}

      - name: Pacote MSIX (Microsoft Store), com identidade de teste
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh packaging/msix/build-msix.ps1 -Out src-tauri/target/release/bundle/msix/Mirante-teste.msix

      - uses: actions/upload-artifact@v7
        with:
          name: mirante-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msix/*.msix
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/examples/teste-explorer.exe
          if-no-files-found: error

  windows:
    name: Instalar e abrir (Windows)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mirante-Windows
          path: dist

      - name: Instalar (NSIS, silencioso)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Recurse -Filter *-setup.exe | Select-Object -First 1
          Write-Host "Instalador: $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB)"
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter mirante.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "mirante.exe não encontrado depois da instalação" }
          Write-Host "Instalado em $($exe.FullName)"
          "MIRANTE_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Associações de arquivo
        shell: pwsh
        run: |
          foreach ($ext in '.md', '.markdown', '.mmd', '.mermaid', '.gv') {
            $k = "HKCU:\Software\Classes\$ext"
            if (Test-Path $k) { Write-Host "$ext -> $((Get-ItemProperty $k).'(default)')" }
            else { Write-Host "::warning::$ext não ficou registrado" }
          }

      - name: Abrir arquivos e capturar a tela
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          New-Item -ItemType Directory shots | Out-Null

          Start-Process $env:MIRANTE_EXE -ArgumentList "`"$PWD\exemplos\mapa-mental.mmd`""
          # a janela nasce oculta e na primeira abertura da VM pode demorar; enquanto isso o
          # MainWindowTitle é o da janela escondida da instância única ("...-siw")
          $title = ""
          for ($i = 0; $i -lt 60 -and $title -notlike '*mapa-mental.mmd*'; $i++) {
            Start-Sleep 1
            $p = Get-Process mirante -ErrorAction SilentlyContinue
            if (-not $p -and $i -ge 10) { throw "o Mirante fechou sozinho" }
            if ($p) { $title = @($p)[0].MainWindowTitle }
          }
          Start-Sleep 3   # deixa o desenho terminar antes da captura
          Write-Host "Título da janela: $title"
          Shot "1-mapa-mental"

          # segunda abertura: a instância única tem de mandar o arquivo para o app já aberto
          Start-Process $env:MIRANTE_EXE -ArgumentList "`"$PWD\exemplos\bem-vindo.md`""
          Start-Sleep 10
          $count = @(Get-Process mirante -ErrorAction SilentlyContinue).Count
          Write-Host "Processos mirante: $count"
          Shot "2-markdown"

          $img = python scripts/teste-imagens.py "$env:RUNNER_TEMP\img"
          Start-Process $env:MIRANTE_EXE -ArgumentList "`"$img`""
          Start-Sleep 10
          Shot "3-imagens"

          if ($title -notlike '*mapa-mental.mmd*') { throw "título inesperado: '$title'" }
          if ($count -ne 1) { throw "instância única falhou: $count processos" }

      - name: Prévia no Explorer (miniaturas e painel de visualização)
        if: always()
        shell: pwsh
        run: |
          $dir = Split-Path $env:MIRANTE_EXE
          Write-Host "DLL: $(Test-Path "$dir\mirante_preview.dll")  web: $(Test-Path "$dir\web\viewer.html")  vendor: $(Test-Path "$dir\web\vendor\marked.min.js")"
          if (-not (Test-Path "$dir\web\vendor\marked.min.js")) { throw "a pasta web\vendor não foi instalada (o instalador achatou as pastas)" }
          # quem o Explorer consulta para o .md: o ProgID, o tipo genérico e os handlers de cada um
          $md = Get-ItemProperty 'Registry::HKEY_CLASSES_ROOT\.md' -ErrorAction SilentlyContinue
          Write-Host ".md -> ProgID '$($md.'(default)')'  PerceivedType '$($md.PerceivedType)'"
          foreach ($k in "$($md.'(default)')", 'SystemFileAssociations\.md', "SystemFileAssociations\$($md.PerceivedType)", '.md') {
            $v = (Get-ItemProperty "Registry::HKEY_CLASSES_ROOT\$k\ShellEx\{e357fccd-a995-4576-b01f-234630154e96}" -ErrorAction SilentlyContinue).'(default)'
            Write-Host "  miniatura em HKCR\$k = $v"
          }
          Get-ChildItem "HKCU:\Software\Classes\.md\ShellEx" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "$($_.PSChildName) = $((Get-ItemProperty $_.PSPath).'(default)')" }
          $teste = Get-ChildItem dist -Recurse -Filter teste-explorer.exe | Select-Object -First 1
          $arquivos = 'estudo-fotossintese.md', 'fluxograma.mmd', 'artigo.tex', 'relatorio.typ' | ForEach-Object { "$PWD\exemplos\$_" }
          New-Item -ItemType Directory -Force shots | Out-Null
          # o Windows Server pode vir com "sempre mostrar ícones, nunca miniaturas"
          $adv = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
          Write-Host "IconsOnly antes: $((Get-ItemProperty $adv -ErrorAction SilentlyContinue).IconsOnly)"
          Set-ItemProperty $adv -Name IconsOnly -Value 0 -Type DWord
          # diagnóstico do painel: a DLL escreve aqui cada passo do WebView2
          $env:MIRANTE_PREVIEW_LOG = "$PWD\shots\painel-log.txt"
          & $teste.FullName shots @arquivos
          $code = $LASTEXITCODE
          Write-Host "---- log do painel ----"
          Get-Content $env:MIRANTE_PREVIEW_LOG -ErrorAction SilentlyContinue
          if ($code) { throw "a prévia do Explorer falhou" }

      # o MSIX só instala assinado: aqui com um certificado de teste (na Store, quem assina é a Microsoft)
      - name: Instalar e abrir o MSIX
        shell: pwsh
        run: |
          $msix = Get-ChildItem dist -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw "MSIX não encontrado nos artefatos" }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Mirante Teste" -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Export-Certificate -Cert $cert -FilePath teste.cer | Out-Null
          Import-Certificate -FilePath teste.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint $msix.FullName
          if ($LASTEXITCODE) { throw "signtool falhou" }
          Add-AppxPackage -Path $msix.FullName
          $pkg = Get-AppxPackage -Name "Mirante.Teste"
          if (-not $pkg) { throw "o MSIX não instalou" }
          Write-Host "Instalado: $($pkg.PackageFullName)"
          # o da etapa anterior ainda está aberto e a instância única mandaria o pedido para ele
          Get-Process mirante -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!Mirante"
          $title = ""
          for ($i = 0; $i -lt 60 -and $title -notlike '*Mirante*'; $i++) {
            Start-Sleep 1
            $p = Get-Process mirante -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle }
            if ($p) { $title = @($p)[0].MainWindowTitle }
          }
          Write-Host "Título da janela: $title"
          if ($title -notlike '*Mirante*') { throw "o Mirante do MSIX não abriu" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Start-Sleep 3
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("shots\3-msix.png"); $g.Dispose(); $bmp.Dispose()

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capturas-windows
          path: shots/

  macos:
    name: Instalar e abrir (macOS)
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mirante-macOS
          path: dist
      - name: Instalar o .dmg e abrir arquivos
        run: |
          mkdir shots
          dmg=$(find dist -name '*.dmg' | head -1)
          echo "DMG: $dmg ($(du -h "$dmg" | cut -f1))"
          # sem tela de licença no .dmg (tauri.macos.conf.json); o yes cobre se ela voltar
          yes | PAGER=cat hdiutil attach "$dmg" -nobrowse -mountpoint /Volumes/Mirante
          cp -R /Volumes/Mirante/Mirante.app /Applications/
          hdiutil detach /Volumes/Mirante
          ls /Applications/Mirante.app/Contents/MacOS/
          lipo -archs /Applications/Mirante.app/Contents/MacOS/*
          codesign -dv /Applications/Mirante.app 2>&1 | grep -E 'Signature|Identifier' || true
          # como o Finder faz num clique duplo: o arquivo chega pelo evento de abertura, não por argumento
          open -a /Applications/Mirante.app "$PWD/exemplos/mapa-mental.mmd"
          # o executável pode se chamar mirante ou Mirante: procura pelo caminho dentro do .app
          for i in $(seq 40); do pgrep -f 'Mirante.app/Contents/MacOS/' >/dev/null && break; sleep 1; done
          pgrep -fl 'Mirante.app/Contents/MacOS/' || { echo "o Mirante não abriu"; exit 1; }
          sleep 12
          screencapture -x shots/1-mapa-mental.png || true
          # segundo arquivo: tem de ir para o mesmo processo
          open -a /Applications/Mirante.app "$PWD/exemplos/estudo-fotossintese.md"
          sleep 10
          screencapture -x shots/2-markdown.png || true
          n=$(pgrep -f 'Mirante.app/Contents/MacOS/' | wc -l | tr -d ' ')
          echo "Processos mirante: $n"
          [ "$n" = 1 ] || { echo "abriu mais de um processo"; exit 1; }
          open -a /Applications/Mirante.app "$(python3 scripts/teste-imagens.py "$RUNNER_TEMP/img")"
          sleep 10
          screencapture -x shots/3-imagens.png || true
      - name: O Finder oferece o Mirante em "Abrir com" para cada extensão?
        if: always()
        run: |
          plist=/Applications/Mirante.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes' "$plist"
          /usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations' "$plist" 2>/dev/null || echo "(sem UTExportedTypeDeclarations)"
          # o Finder registra o app sozinho ao copiar para /Applications; aqui força para não depender do tempo
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/Mirante.app
          t=$(mktemp -d)
          for e in md markdown mdown mkd mkdn mmd mermaid gv tex typ bib txt; do echo x > "$t/a.$e"; done
          cat > "$t/check.swift" <<'EOF'
          import AppKit
          let pasta = CommandLine.arguments[1]
          var falhou = false
          for e in CommandLine.arguments.dropFirst(2) {
            let u = URL(fileURLWithPath: "\(pasta)/a.\(e)")
            let apps = NSWorkspace.shared.urlsForApplications(toOpen: u).map { $0.lastPathComponent }
            let padrao = NSWorkspace.shared.urlForApplication(toOpen: u)?.lastPathComponent ?? "nenhum"
            let ok = apps.contains("Mirante.app")
            if !ok { falhou = true }
            print("\(ok ? "OK " : "NÃO") .\(e)  abre por padrão com: \(padrao)  |  Abrir com: \(apps.joined(separator: ", "))")
          }
          exit(falhou ? 1 : 0)
          EOF
          swift "$t/check.swift" "$t" md markdown mdown mkd mkdn mmd mermaid gv tex typ bib txt
      - name: Quick Look (pré-visualização e miniaturas)
        if: always()
        run: |
          mkdir -p shots
          for x in MirantePreview MiranteThumbnail; do
            a=/Applications/Mirante.app/Contents/PlugIns/$x.appex
            echo "== $x"; ls "$a/Contents/MacOS" || true
            codesign -dv --entitlements - "$a" 2>&1 | grep -E 'Identifier|sandbox|Signature' || true
            codesign --verify --strict --verbose=2 "$a" 2>&1 || true
            plutil -p "$a/Contents/Info.plist" | sed -n '/NSExtension/,$p' || true
            ls -la "$a/Contents/MacOS"; lipo -info "$a/Contents/MacOS/$x" || true
            otool -l "$a/Contents/MacOS/$x" | grep -A4 LC_BUILD_VERSION | head -10 || true
            pluginkit -a -v "$a" 2>&1 || true
          done
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          $lsregister -f -R -trusted /Applications/Mirante.app 2>&1 | tail -5 || true
          sleep 5
          pluginkit -m -v -p com.apple.quicklook.preview | grep -i mirante || echo "pré-visualização não registrada"
          pluginkit -m -v -p com.apple.quicklook.thumbnail | grep -i mirante || echo "miniaturas não registradas"
          echo "== o que o sistema diz das extensões"
          pluginkit -m -A -D -v -i io.github.mirante.Viewer.MiranteThumbnail 2>&1 || true
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -dump 2>/dev/null \
            | grep -i -A12 "MiranteThumbnail.appex" | head -40 || true
          log show --last 5m --info --debug --style compact --predicate 'process == "pkd" OR subsystem == "com.apple.pluginkit"' 2>/dev/null \
            | grep -i -E "mirante|thumbnail|reject|invalid|error" | tail -40 || true
          # a janela do Mirante, aberta no passo anterior, não pode tapar a prévia
          osascript -e 'quit app "Mirante"' 2>/dev/null || true; pkill -x Mirante || true; sleep 2
          qlmanage -r >/dev/null 2>&1; qlmanage -r cache >/dev/null 2>&1
          # as miniaturas como o Finder pede (o qlmanage -t não usa as extensões novas)
          ok_miniaturas=0
          swift packaging/macos/quicklook/teste-miniatura.swift shots \
            exemplos/estudo-fotossintese.md exemplos/fluxograma.mmd exemplos/artigo.tex exemplos/relatorio.typ || ok_miniaturas=1
          qlmanage -p exemplos/estudo-fotossintese.md >/dev/null 2>&1 &
          sleep 10
          screencapture -x shots/quicklook-previa.png || true
          kill %1 2>/dev/null || true
          echo "== log da pré-visualização"
          log show --last 3m --info --style compact --predicate 'process == "MirantePreview" OR eventMessage CONTAINS "Mirante:"' 2>/dev/null \
            | grep -v -E "runningboard|cfprefsd|CarbonCore|xpc:connection|BoardServices" | head -120 || true
          echo "== relatórios de falha"
          for r in ~/Library/Logs/DiagnosticReports/Mirante*; do [ -e "$r" ] && { echo "-- $r"; head -60 "$r"; }; done
          ls -la shots
          exit $ok_miniaturas

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capturas-macos
          path: shots/

  linux:
    name: Instalar e abrir (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mirante-Linux
          path: dist
      - name: Instalar o .deb num sistema limpo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "./$(find dist -name '*.deb' | head -1)" xvfb imagemagick dbus-x11
      - name: Abrir um mapa mental e capturar a tela
        run: |
          mkdir shots
          export DISPLAY=:99
          Xvfb :99 -screen 0 1400x960x24 &
          sleep 2
          dbus-run-session -- mirante exemplos/mapa-mental.mmd &
          sleep 15
          pgrep -x mirante || { echo "o Mirante fechou sozinho"; exit 1; }
          import -window root "shots/linux-${{ matrix.os }}.png"
          # imagens no .md: relativa, absoluta, file://, HTML e da internet
          pkill -x mirante; sleep 1
          dbus-run-session -- mirante "$(python3 scripts/teste-imagens.py "$RUNNER_TEMP/img")" &
          sleep 10
          import -window root "shots/linux-${{ matrix.os }}-imagens.png"
      - name: Miniaturas do gerenciador de arquivos (sem tela, como o Nautilus roda)
        run: |
          test -f /usr/share/thumbnailers/mirante.thumbnailer
          unset DISPLAY WAYLAND_DISPLAY
          for f in exemplos/*; do
            /usr/bin/mirante --thumbnail "$f" "shots/miniatura-$(basename "$f").png" 256
            file "shots/miniatura-$(basename "$f").png" | grep -q "PNG image data, 192 x 256"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capturas-${{ matrix.os }}
          path: shots/
