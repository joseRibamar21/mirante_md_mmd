name: Release

# Publica uma versão ao enviar uma tag vX.Y.Z (ela precisa bater com `version` em src-tauri/Cargo.toml):
#   git tag v2.1.0 && git push origin v2.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Gerar (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-14
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Conferir a versão
        shell: bash
        run: |
          app="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$app" != "$tag" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com version = \"$app\" em src-tauri/Cargo.toml"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev

      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}

      # nomes fixos: o README aponta para releases/latest/download/<nome>
      - name: Renomear os instaladores (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/deb/*.deb out/Mirante-linux-amd64.deb
      - name: Renomear os instaladores (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/Mirante-macos-universal.dmg
      - name: Renomear os instaladores (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)[0] out/Mirante-windows-x64-setup.exe
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi)[0] out/Mirante-windows-x64.msi

      # pacote da Microsoft Store: só sai quando a identidade do Partner Center estiver nas variáveis do
      # repositório (Settings → Secrets and variables → Actions → Variables)
      - name: Pacote MSIX (Microsoft Store)
        if: runner.os == 'Windows' && vars.MSSTORE_IDENTITY_NAME != ''
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: pwsh packaging/msix/build-msix.ps1 -Out out/Mirante-windows-x64.msix

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publicar a release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v3
        with:
          name: Mirante ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
          body: |
            ## Instalar

            | Sistema | Arquivo |
            | --- | --- |
            | **Windows 10 e 11** | `Mirante-windows-x64-setup.exe` (recomendado) ou `Mirante-windows-x64.msi` |
            | **Ubuntu 22.04+ / Debian 12+** | `Mirante-linux-amd64.deb` → `sudo apt install ./Mirante-linux-amd64.deb` |
            | **macOS 10.15+** (Apple Silicon e Intel) | `Mirante-macos-universal.dmg` → arraste o Mirante para Aplicativos |

            No Windows o instalador registra o Mirante para abrir `.md`, `.mmd`, `.gv` e `.txt`. Se o SmartScreen avisar
            que o app é de um editor desconhecido, clique em **Mais informações → Executar assim mesmo**
            (o instalador ainda não tem assinatura digital).

            No Mac, o app ainda não é autenticado pela Apple: na primeira vez, abra o Mirante, feche o aviso e vá em
            **Ajustes do Sistema → Privacidade e Segurança → Abrir Mesmo Assim**.

  # manda a versão nova para o winget (abre um PR no microsoft/winget-pkgs). Precisa do segredo
  # WINGET_TOKEN: um token clássico com o escopo public_repo. Sem ele, o passo é pulado.
  winget:
    name: Atualizar o winget
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - name: Conferir o token
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::sem WINGET_TOKEN: winget não atualizado"; fi
      - uses: vedantmgoyal9/winget-releaser@v2
        if: steps.token.outputs.ok == 'true'
        with:
          identifier: JoseRibamar.Mirante
          installers-regex: '-setup\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
