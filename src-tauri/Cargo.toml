[package]
name = "mirante"
version = "2.0.0"
description = "Visualizador e editor de Markdown e diagramas Mermaid"
authors = ["José Ribamar"]
license = "MIT"
repository = "https://github.com/joseRibamar21/mirante_md_mmd"
edition = "2024"

[dependencies]
notify = "8.2.2"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"

[build-dependencies]
tauri-build = "2.7.4"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation"] }

[profile.release]
strip = true
