[package]
name = "mirante"
version = "2.6.0"
description = "Visualizador e editor de Markdown e diagramas Mermaid"
authors = ["José Ribamar"]
license = "MIT"
repository = "https://github.com/joseRibamar21/mirante_md_mmd"
edition = "2024"

[dependencies]
base64 = "0.22"
comemo = "0.5.1"
notify = "8.2.2"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
resvg = { version = "0.45", default-features = false, features = ["system-fonts", "text"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["datetime", "embedded-fonts", "scan-fonts", "system-downloader", "system-files"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"

# preview/: a prévia no gerenciador de arquivos (DLL do Explorer no Windows, biblioteca do Quick Look no Mac)
[workspace]
members = ["preview"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_Foundation"] }

[profile.release]
strip = true

# bibliotecas otimizadas e sem informação de depuração no modo de desenvolvimento: o Typst fica rápido
# nos testes e a pasta target/ não passa de alguns GB
[profile.dev.package."*"]
opt-level = 2
debug = false
