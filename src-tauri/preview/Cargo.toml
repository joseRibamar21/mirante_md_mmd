[package]
name = "mirante-preview"
version = "2.6.0"
description = "Prévia do Mirante no gerenciador de arquivos: miniaturas e painel do Explorer (Windows), miniaturas do Quick Look (Mac)"
license = "MIT"
edition = "2024"
publish = false

[lib]
name = "mirante_preview"
# cdylib: a DLL que o Explorer carrega; staticlib: o que a extensão do Quick Look (Swift) liga
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
comemo = "0.5.1"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
resvg = { version = "0.45", default-features = false, features = ["system-fonts", "text"] }
serde_json = "1.0.154"
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["datetime", "embedded-fonts", "scan-fonts", "system-downloader", "system-files"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_Security",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
